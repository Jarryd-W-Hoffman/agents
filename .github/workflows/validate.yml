name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the repository.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Manifests, agents and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pinned to a major so an unrelated CLI release cannot break CI silently.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2
      - name: Validate manifests, agents and skills
        run: ./scripts/check.sh --manifests

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The hooks and scripts run under whatever python3 the user has.
        # 3.9 is what stock macOS still ships; 3.13 is the current release.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the Python suites
        run: ./scripts/check.sh --tests
